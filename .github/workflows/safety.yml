name: Dependency and privacy baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    # This checks repository metadata, not native application qualification.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Query current advisories for the locked public dependencies
        run: python -B tools/safety/advisories.py --output target/safety/advisories.json
      - name: Check privacy, inventory, exceptions and generated contracts
        run: bash tools/check-safety.sh --implementation-only --advisories target/safety/advisories.json
      - name: Preserve dependency audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: target/safety/advisories.json
          if-no-files-found: warn
          retention-days: 14
