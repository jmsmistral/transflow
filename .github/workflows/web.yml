name: Lineage web UI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Prepare exact npm and locked dependencies
        run: |
          npm install --global npm@11.4.2 --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts
      - name: Check types, components and reproducible production assets
        run: bash tools/check-web.sh
      - name: Preserve measured web reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ matrix.os }}
          path: |
            target/web/unit-tests.json
            target/web/build-hashes.json
          if-no-files-found: warn
          retention-days: 14
