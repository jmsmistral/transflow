name: Python packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.13.15', '3.14.7']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare hash-locked tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m venv target/python/ci
          python_minor="$(python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')"
          target/python/ci/bin/python -m pip install --require-hashes --only-binary=:all: -r "python/dev-py${python_minor}.lock"
      - name: Check types, lint, wheel contents and isolated installations
        shell: bash
        run: PYTHON_CHECK="$PWD/target/python/ci/bin/python" bash tools/check-python.sh
      - name: Preserve package test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-packages-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            target/python/py*/tests.xml
            target/python/py*/wheels/*
          if-no-files-found: warn
          retention-days: 14
