[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["python/sdk/src", "python/worker/src", "python/tests", "python/tools"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/sdk/src", "$MYPY_CONFIG_FILE_DIR/worker/src", "$MYPY_CONFIG_FILE_DIR/tools", "$MYPY_CONFIG_FILE_DIR/tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sdk/src", "worker/src", "tools", "tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transflow"
dynamic = ["version"]
description = "Transflow typed SDK and isolated worker bootstrap"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
transflow-worker = "transflow_worker.cli:main"

[tool.setuptools]
packages = ["transflow", "transflow_worker"]
package-dir = {transflow = "sdk/src/transflow", transflow_worker = "worker/src/transflow_worker"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "transflow._version.__version__"}

[tool.setuptools.package-data]
transflow = ["py.typed"]
transflow_worker = ["py.typed"]
